<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My-todo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./src/output.css">
</head>

<body class="min-h-screen bg-[#0d1117] text-[#e6edf3] flex flex-col">

    <div class="bg-grid fixed inset-0 z-0 pointer-events-none"></div>

    <div class="animate-drift fixed -top-48 -left-24 w-150 h-150 rounded-full pointer-events-none z-0"
        style="background: radial-gradient(circle, rgba(29,158,117,0.12) 0%, transparent 70%)"></div>
    <div class="animate-drift-2 fixed -bottom-24 -right-12 w-100 h-100 rounded-full pointer-events-none z-0"
        style="background: radial-gradient(circle, rgba(29,158,117,0.07) 0%, transparent 70%)"></div>

    <!-- ===== NAVBAR ===== -->
    <nav
        class="relative z-10 flex items-center justify-between px-6 py-4 border-b border-[#1D9E75]/15 bg-[#0d1117]/80 backdrop-blur-md">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 bg-emerald-600 rounded-lg flex items-center justify-center shrink-0">
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2.5"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
            </div>
            <span class="text-[15px] font-semibold text-[#e6edf3] tracking-tight">My-todo</span>
        </div>
        <div class="flex items-center gap-2.5">
            <button
                class="px-4 py-1.5 rounded-lg border border-emerald-600/30 text-emerald-500 text-[13px] font-medium hover:bg-emerald-600/10 hover:border-emerald-500 transition cursor-pointer" onclick="logout()">
                Sign out
            </button>
        </div>
    </nav>

    <!-- ===== MAIN ===== -->
    <main class="relative z-1 flex-1 flex flex-col items-center px-4 pt-12 pb-16">

        <!-- Hero -->
        <div class="animate-fade-down text-center max-w-lg mb-10">
            <div
                class="inline-flex items-center gap-1.5 bg-emerald-600/10 border border-emerald-600/25 text-emerald-400 text-[11px] font-medium uppercase tracking-widest px-3 py-1 rounded-full mb-5">
                <span class="animate-pulse-dot w-1.5 h-1.5 bg-emerald-500 rounded-full"></span>
                User mode
            </div>
            <h1 class="text-[clamp(28px,5vw,38px)] font-bold text-[#e6edf3] leading-tight tracking-tight mb-3">
                Your tasks,<br><span class="text-emerald-500">done right.</span>
            </h1>
            <p class="text-[14px] text-[#7d8590] leading-relaxed">
                Add todos below. Your todos are save permanently and sync across devices.
            </p>
        </div>

        <!-- ===== TODO CARD ===== -->
        <div class="animate-fade-up w-full max-w-140 bg-[#161b22] border border-[#30363d] rounded-2xl overflow-hidden">

            <!-- Input section -->
            <div class="flex flex-col border-b border-[#30363d]">
                <!-- Title -->
                <div class="flex items-center border-b border-[#21262d]">
                    <span class="mono text-[10px] text-[#484f58] uppercase tracking-widest px-4 shrink-0">Title</span>
                    <input id="todoTitleU" type="text" placeholder="What needs to be done?" maxlength="120"
                        autocomplete="off"
                        class="mono flex-1 h-11.5 pr-4 bg-transparent border-none outline-none text-[13px] text-[#e6edf3] placeholder-[#484f58]">
                </div>
                <!-- Body + Add button -->
                <div class="flex items-start">
                    <span
                        class="mono text-[10px] text-[#484f58] uppercase tracking-widest px-4 pt-3 shrink-0">Body</span>
                    <textarea id="todoBodyU" placeholder="Add a description (optional)" maxlength="500" rows="2"
                        class="mono flex-1 pt-3 pb-3 pr-4 bg-transparent border-none outline-none text-[13px] text-[#e6edf3] placeholder-[#484f58] resize-none leading-relaxed"></textarea>
                    <button type="button" onclick="addTodo()"
                        class="flex items-center gap-1.5 px-4 h-full min-h-17 bg-emerald-600 hover:bg-emerald-700 text-white text-[13px] font-medium transition whitespace-nowrap cursor-pointer self-stretch">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                        </svg>
                        Add
                    </button>
                </div>
            </div>

            <!-- Filter tabs -->
            <div class="flex gap-1 px-3.5 py-2.5 border-b border-[#21262d]">
                <button data-filter="all" onclick="setFilter('all', this)"
                    class="tab-btn active-tab px-3 py-1 rounded-md text-[12px] font-medium transition cursor-pointer">All</button>
                <button data-filter="active" onclick="setFilter('active', this)"
                    class="tab-btn px-3 py-1 rounded-md text-[12px] font-medium transition cursor-pointer text-[#7d8590] hover:text-[#e6edf3] hover:bg-[#21262d]">Active</button>
                <button data-filter="done" onclick="setFilter('done', this)"
                    class="tab-btn px-3 py-1 rounded-md text-[12px] font-medium transition cursor-pointer text-[#7d8590] hover:text-[#e6edf3] hover:bg-[#21262d]">Done</button>
            </div>

            <!-- List -->
            <div id="todoLists" class="todo-scroll min-h-30 max-h-95 overflow-y-auto"></div>

            <div class="flex items-center justify-between px-4 py-2.5 border-t border-[#21262d] bg-[#0d1117]">
                <span id="footerCount" class="mono text-[11px] text-[#484f58]">0 tasks</span>
                <button onclick="clearDone()"
                    class="text-[11px] text-[#484f58] hover:text-red-400 bg-transparent border-none cursor-pointer transition">
                    Clear completed
                </button>
            </div>
        </div>

        <div
            class="animate-fade-up-2 w-full max-w-140 mt-3 flex items-center gap-3 bg-emerald-600/8 border border-emerald-600/20 rounded-xl px-4 py-3">
            <svg class="w-4 h-4 text-emerald-500 shrink-0" fill="none" stroke="currentColor" stroke-width="2"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <p class="flex-1 text-[12px] text-[#7d8590] leading-relaxed">
                You're in <span class="text-emerald-400 font-medium">user mode</span> — todos will be saved when you
                leave.
            </p>
        </div>

    </main>

    <footer class="relative z-1 text-center py-4 text-[11px] text-[#30363d] border-t border-[#21262d]">
        My-todo &mdash; user session. Data is save for server.
    </footer>

    <script src="./js/config.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/dashboard.js"></script>
</body>

</html>
